# .github/workflows/tick.yml
name: tick
on:
  schedule:
    # Every 30 min, 13:00-21:59 UTC weekdays. Covers 9:30am-4pm ET in both
    # EDT (13:30-20:00 UTC) and EST (14:30-21:00 UTC); run.py gates precisely.
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tick
        env:
          # The DEDICATED relative-strength Stocktwits account's token —
          # distinct from the 52wk-poster's account. Only consumed once we go
          # live (below); the preview phase does not need it.
          STOCKTWITS_ACCESS_TOKEN: ${{ secrets.STOCKTWITS_ACCESS_TOKEN }}
          # Launch ramp: 1 post/tick (a gentle 30-min trickle that dodges the
          # duplicate filter), 12/day. Remove these two to restore 2/20 defaults.
          MAX_PER_TICK: "1"
          MAX_PER_DAY: "12"
          PYTHONUNBUFFERED: "1"
        # PREVIEW PHASE (current): dry-run. Renders the 1-yr charts in-process
        # (matplotlib + stockanalysis.com history — keyless) and writes what
        # *would* be posted to output/YYYY-MM-DD/ (chart PNG + post text),
        # committed below — review a few days of samples before going live.
        # No secrets required at all in this phase.
        #
        # GO LIVE: change the line below to `python run.py --sync-state --live`
        # and set the STOCKTWITS_ACCESS_TOKEN secret (dedicated RS account).
        run: python run.py
      - name: Commit state + output
        # main only: the rebase/push flow assumes the cron branch; a manual
        # dispatch on a feature branch (e.g. testing a PR) must never push.
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "rs-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state output
          if git diff --cached --quiet; then
            echo "nothing to record this tick"; exit 0
          fi
          git commit -m "tick: $(date -u +'%Y-%m-%dT%H:%M') (preview)"
          git pull --rebase origin main
          git push
